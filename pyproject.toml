[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raffael"
version = "0.6.0"
description = "small service checks for things i run"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "pysnmp>=7,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[project.scripts]
raffael = "raffael.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
